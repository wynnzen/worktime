<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Excel工时分析</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.15.6/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f4f6f9;
      color: #1f2937;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      padding: 24px 28px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e5e7eb;
    }
    .header h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      color: #111827;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    input[type="file"] {
      font-size: 14px;
      color: #4b5563;
      background: #f9fafb;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
    }
    input[type="file"]::file-selector-button {
      border: none;
      background: #2563eb;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      margin-right: 10px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }
    input[type="file"]::file-selector-button:hover {
      background: #1d4ed8;
    }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary {
      background: #10b981;
      color: #fff;
    }
    .btn-primary:hover {
      background: #059669;
    }
    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #d1d5db;
    }
    .btn-secondary:hover {
      background: #e5e7eb;
    }
    .btn-danger {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }
    .btn-danger:hover {
      background: #fee2e2;
    }
    #tableContainer {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }
    #tableContainer:empty {
      border: none;
    }
    #tableContainer table {
      margin: 0;
      border-collapse: collapse;
      width: 100%;
      font-size: 14px;
    }
    #tableContainer td {
      border-bottom: 1px solid #e5e7eb;
      border-right: 1px solid #f3f4f6;
      padding: 10px 12px;
      text-align: center;
      white-space: nowrap;
    }
    #tableContainer td:last-child {
      border-right: none;
    }
    #tableContainer tr:first-child td {
      background: #f8fafc;
      color: #374151;
      font-weight: 600;
      border-bottom: 2px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    #tableContainer tr:not(:first-child):hover {
      background: #f1f5f9;
    }
    #tableContainer tr.rest-row {
      background: #fafafa;
      color: #9ca3af;
    }
    .fix-input {
      width: 76px;
      padding: 4px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      text-align: center;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .fix-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Excel 工时分析</h2>
      <div class="actions">
        <input type="file" id="fileInput" accept=".xlsx,.xls" />
        <button id="resetFixBtn" class="btn btn-secondary" style="display:none;">清空修正工时</button>
        <button id="clearBtn" class="btn btn-danger" style="display:none;">清空</button>
        <button id="downloadBtn" class="btn btn-primary" style="display:none;">下载分析结果</button>
      </div>
    </div>
    <div id="tableContainer"></div>
  </div>
  <script>
    function parseTime(str) {
      if (!str) return null;
      const [h, m] = str.split(':').map(Number);
      return h * 60 + m;
    }
    function formatHour(mins) {
      return (mins / 60).toFixed(2);
    }
    function formatTime(mins) {
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = evt.target.result;
        const workbook = XLSX.read(data, {type: 'binary'});
        const wsname = workbook.SheetNames[0];
        const ws = workbook.Sheets[wsname];
        const json = XLSX.utils.sheet_to_json(ws, {header:1});
        // 用于追踪哪些行的下班时间是计算出来的
        const calculatedOffRows = [];
        const noPunchRows = [];
        const fixHours = {};
        // 添加新表头
        json[0][5] = '工时(小时)';
        json[0][6] = '修正工时';
        json[0][7] = '合计工时';
        json[0][8] = '工时不足';
        json[0][9] = '打卡时间异常';
        json[0][10] = '变化工时';
        for (let i = 1; i < json.length; i++) {
          const row = json[i];
          const todayStr = new Date().toISOString().slice(0, 10); // yyyy-mm-dd
          const isToday = row[0] && String(row[0]).slice(0,10) === todayStr;
          // 跳过班次为休息的行
          if (row[2] && String(row[2]).includes('休息')) continue;
          
          const on = row[3], off = row[4];
          const onMins = parseTime(on);
          let offMins = parseTime(off);
          
          // 如果是今天且有上班打卡时间，计算预计下班时间
          if (isToday && onMins !== null && offMins === null) {
            offMins = onMins + 8.5 * 60; // 加上8.5小时
            row[4] = formatTime(offMins);
            calculatedOffRows.push(i); // 标记这行的下班时间是计算的
          }
          
          // 计算工时差值，先减去0.5小时（30分钟）
          const duration = offMins - onMins - 30;
          if(duration === -30) {
            noPunchRows.push(i);
            row[5] = 0;
            row[6] = 0;
            row[7] = 0;
            row[8] = '无打卡';
            row[9] = '无打卡';
            row[10] = '';
            continue;
          }
          row[5] = formatHour(duration);
          row[6] = 0;
          row[7] = row[5];
          row[8] = '';
          // 打卡异常判断
          row[9] = (onMins > 600 || offMins < 960) ? '打卡时间异常' : '正常';
          row[10] = '';
        }
        // 展示表格
        const html = XLSX.utils.sheet_to_html(XLSX.utils.aoa_to_sheet(json));
        document.getElementById('tableContainer').innerHTML = html;

        const table = document.querySelector('#tableContainer table');
        function recalc() {
          let cumDiff = 0;
          for (let i = 1; i < json.length; i++) {
            const row = json[i];
            if (row[2] && String(row[2]).includes('休息')) continue;
            const tr = table && table.rows[i];
            const fix = Number(fixHours[i]) || 0;
            row[6] = fix;
            if (noPunchRows.includes(i) && fix === 0) {
              row[7] = 0;
              row[8] = '无打卡';
              row[10] = '';
              if (tr) {
                tr.cells[7].innerText = '0';
                tr.cells[8].innerText = '无打卡';
                tr.cells[8].style.color = '#9ca3af';
                tr.cells[10].innerText = '';
                tr.cells[10].style.color = '';
              }
              continue;
            }
            const total = +(Number(row[5]) + fix).toFixed(2);
            cumDiff = +(cumDiff + (total - 8)).toFixed(2);
            row[7] = total.toFixed(2);
            row[8] = total < 8 ? '工时不足' : '正常';
            row[10] = cumDiff.toFixed(2);
            if (tr) {
              tr.cells[7].innerText = row[7];
              tr.cells[8].innerText = row[8];
              tr.cells[8].style.color = row[8] === '工时不足' ? '#dc2626' : '#16a34a';
              tr.cells[8].style.fontWeight = row[8] === '工时不足' ? '600' : '';
              tr.cells[10].innerText = (cumDiff > 0 ? '+' : '') + row[10];
              tr.cells[10].style.color = cumDiff > 0 ? '#16a34a' : (cumDiff < 0 ? '#dc2626' : '');
              tr.cells[10].style.fontWeight = cumDiff !== 0 ? '600' : '';
            }
          }
        }

        if (table) {
          for (let i = 1; i < table.rows.length; i++) {
            const dataRow = json[i];
            const row = table.rows[i];
            if (dataRow[2] && String(dataRow[2]).includes('休息')) {
              row.classList.add('rest-row');
              continue;
            }
            if (row.cells[6]) {
              row.cells[6].innerHTML = `<input type="number" step="0.01" value="0" class="fix-input" />`;
              row.cells[6].querySelector('input').addEventListener('input', function(ev) {
                fixHours[i] = ev.target.value;
                recalc();
              });
            }
            // 打卡时间异常列
            if (row.cells[9]) {
              if (row.cells[9].innerText === '打卡时间异常') {
                row.cells[9].style.color = '#dc2626';
                row.cells[9].style.fontWeight = '600';
              } else if (row.cells[9].innerText === '正常') {
                row.cells[9].style.color = '#16a34a';
              }
            }
            // 计算出的下班时间标记为浅绿色
            if (calculatedOffRows.includes(i) && row.cells[4]) {
              row.cells[4].style.color = '#10b981';
              row.cells[4].style.fontWeight = '600';
            }
          }
        }
        recalc();

        const downloadBtn = document.getElementById('downloadBtn');
        const resetFixBtn = document.getElementById('resetFixBtn');
        const clearBtn = document.getElementById('clearBtn');

        downloadBtn.style.display = '';
        resetFixBtn.style.display = '';
        clearBtn.style.display = '';

        resetFixBtn.onclick = function() {
          Object.keys(fixHours).forEach(k => delete fixHours[k]);
          document.querySelectorAll('#tableContainer .fix-input').forEach(inp => { inp.value = 0; });
          recalc();
        };

        clearBtn.onclick = function() {
          document.getElementById('fileInput').value = '';
          document.getElementById('tableContainer').innerHTML = '';
          downloadBtn.style.display = 'none';
          resetFixBtn.style.display = 'none';
          clearBtn.style.display = 'none';
        };

        downloadBtn.onclick = function() {
          const newWb = XLSX.utils.book_new();
          const newWs = XLSX.utils.aoa_to_sheet(json);
          XLSX.utils.book_append_sheet(newWb, newWs, '分析结果');
          XLSX.writeFile(newWb, '分析结果.xlsx');
        };
      };
      reader.readAsBinaryString(file);
    });
  </script>
</body>
</html>
